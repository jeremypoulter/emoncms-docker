# Base docker compose, added to by docker-compose.override or docker-compose.prod. See Readme.md

services:
  # PHP & apache container with s6-overlay managing web server and background workers
  web:
    image: openenergymonitor/emoncms:latest
    build: web/.
    volumes:
      - emon-phpfina:/var/opt/emoncms/phpfina
      - emon-phptimeseries:/var/opt/emoncms/phptimeseries
    links:
      - db
      - redis
      - mqtt

  db:
    image: mariadb:11.0
    environment:
      - "MYSQL_HOST=localhost"
      - "MARIADB_AUTO_UPGRADE=1"
      - "MARIADB_INITDB_SKIP_TZINFO=1"
    volumes:
      - emon-db-data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "10m"

  redis:
    image: redis:7.0
    volumes:
      - emon-redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"

  mqtt:
    image: eclipse-mosquitto:2.0
    build: mqtt/.
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"

volumes:
  emon-phpfina:
    driver: local
  emon-phptimeseries:
    driver: local
  emon-db-data:
    driver: local
  emon-redis-data:
    driver: local
