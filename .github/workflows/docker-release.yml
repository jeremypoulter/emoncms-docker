name: Build and Push emoncms Docker Image

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly rebuild to pick up Debian package fixes on top of the pinned base.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Publishing runs queue so an older build cannot overwrite a newer :latest.
# Superseded pull request builds are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      dockerhub_available: ${{ steps.registry.outputs.available }}
      php_image: ${{ steps.php.outputs.image }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve PHP image
        id: php
        shell: bash
        run: |
          set -euo pipefail
          # The digest-pinned base image lives in the Dockerfile so Renovate can bump it.
          image=$(sed -n 's/^ARG BUILD_FROM=//p' web/Dockerfile)
          case "$image" in
            php:*@sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf 'web/Dockerfile BUILD_FROM is not digest-pinned: %s\n' "$image" >&2; exit 1 ;;
          esac
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Check for Docker Hub credentials
        id: registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get emoncms version
        id: emoncms_version
        run: |
          set -euo pipefail
          # emoncms core is pinned in web/components.lock
          commit=$(awk '$1 == "emoncms" { print $5 }' web/components.lock)
          url="https://raw.githubusercontent.com/emoncms/emoncms/${commit}/version.json"
          version=$(curl -fsSL "$url" | jq --raw-output '.version')
          echo "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set image tags
        id: tags
        run: |
          VERSION="${{ steps.emoncms_version.outputs.version }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS="ghcr.io/${{ github.repository_owner }}/emoncms:pr-${{ github.event.number }}"
          elif [ "${{ steps.registry.outputs.available }}" = "true" ]; then
            TAGS="openenergymonitor/emoncms:latest,openenergymonitor/emoncms:${VERSION}"
          else
            TAGS="ghcr.io/${{ github.repository_owner }}/emoncms:latest,ghcr.io/${{ github.repository_owner }}/emoncms:${VERSION}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

  extensions:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build PHP extensions
        run: |
          ci/build-extension-artifacts.sh \
            "${{ needs.metadata.outputs.php_image }}" \
            "${{ matrix.architecture }}" \
            "$RUNNER_TEMP/extensions"

      - name: Upload PHP extensions
        uses: actions/upload-artifact@v7
        with:
          name: php-extensions-${{ matrix.architecture }}
          path: ${{ runner.temp }}/extensions/
          if-no-files-found: error
          retention-days: 7

  build-and-push:
    needs: [metadata, extensions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download amd64 PHP extensions
        uses: actions/download-artifact@v8
        with:
          name: php-extensions-amd64
          path: web/extensions/linux-amd64

      - name: Download arm64 PHP extensions
        uses: actions/download-artifact@v8
        with:
          name: php-extensions-arm64
          path: web/extensions/linux-arm64

      - name: Check extension artifacts
        run: |
          set -euo pipefail
          test "$(find web/extensions -name '*.so' -type f | wc -l)" -eq 8

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: needs.metadata.outputs.dockerhub_available == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: needs.metadata.outputs.dockerhub_available != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_FROM=${{ needs.metadata.outputs.php_image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ needs.metadata.outputs.tags }}

  scan:
    # Scan the published image for known vulnerabilities (fixable HIGH/CRITICAL fail the job).
    if: github.event_name != 'pull_request'
    needs: [metadata, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Pick image to scan
        id: image
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: echo "ref=${TAGS%%,*}" >> "$GITHUB_OUTPUT"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

  scan-pr:
    # Build the candidate image (amd64, not pushed) and scan it before the PR can merge.
    # This is the check that gates automerge of PHP base image digest bumps.
    name: Scan candidate image
    if: github.event_name == 'pull_request'
    needs: [metadata, extensions]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download amd64 PHP extensions
        uses: actions/download-artifact@v8
        with:
          name: php-extensions-amd64
          path: web/extensions/linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          platforms: linux/amd64
          build-args: |
            BUILD_FROM=${{ needs.metadata.outputs.php_image }}
          load: true
          push: false
          tags: emoncms-candidate:pr

      - name: Scan candidate image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: emoncms-candidate:pr
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
